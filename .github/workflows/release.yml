name: Release VOIDFALL

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify version and run tests
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
          npm test
      - name: Package Windows-ready source bundle
        run: |
          git archive --format=zip --prefix="VOIDFALL-${GITHUB_REF_NAME}/" "${GITHUB_REF_NAME}" -o "VOIDFALL-${GITHUB_REF_NAME}.zip"
          sha256sum "VOIDFALL-${GITHUB_REF_NAME}.zip" > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "VOIDFALL $GITHUB_REF_NAME" --generate-notes "VOIDFALL-${GITHUB_REF_NAME}.zip" SHA256SUMS
