name: Package VOIDFALL release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable game archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "dist/VOIDFALL-v${version}"
          cp -r index.html style.css src assets manifest.webmanifest sw.js start-game.bat serve.cjs package.json README.md CHANGELOG.md LICENSE .github "dist/VOIDFALL-v${version}/"
          cd dist
          zip -qr "VOIDFALL-v${version}.zip" "VOIDFALL-v${version}"
          sha256sum "VOIDFALL-v${version}.zip" > "VOIDFALL-v${version}.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/VOIDFALL-v*
